<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 486" width="1960" height="486" fill="none">
  <defs>
    <!-- Brushed Gunmetal Titanium for "NOBLE" -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="38%" stop-color="#94A3B8" />
      <stop offset="44%" stop-color="#E2E8F0" />
      <stop offset="52%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Anodized Molten Amber / Gold for "FERMI" -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="32%" stop-color="#FFB300" />
      <stop offset="46%" stop-color="#FFE082" />
      <stop offset="54%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Bullet Hole Carbon Scorch Radial Gradient -->
    <radialGradient id="bulletScorch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1" />
      <stop offset="38%" stop-color="#FF6D00" stop-opacity="0.92" />
      <stop offset="55%" stop-color="#090D16" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Plasma Ricochet Radial Gradient -->
    <radialGradient id="cyanScorch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1" />
      <stop offset="42%" stop-color="#00E5FF" stop-opacity="0.95" />
      <stop offset="62%" stop-color="#05101A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Rough Abraded Metal Displacement & Grunge Filter -->
    <filter id="roughMetal" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.18" numOctaves="3" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.8" xChannelSelector="R" yChannelSelector="G" result="roughened" />
      <feDropShadow dx="-8" dy="10" stdDeviation="0" flood-color="#070E1A" flood-opacity="1" />
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.82" />
    </filter>

    <!-- Serrated Hacksaw Split Clip Paths (Upper Sheared Half vs Lower Half) -->
    <!-- Saw line runs diagonally from (0, 272) to (1960, 206) with jagged saw-teeth -->
    <clipPath id="sawUpperClip">
      <polygon points="
        0,0 1960,0 1960,198
        1890,204 1882,196 1840,206 1832,199 1790,209 1782,201 1735,211 1728,203
        1680,213 1672,205 1625,215 1618,207 1570,217 1562,209 1515,219 1508,211
        1460,221 1452,213 1405,223 1398,215 1350,225 1342,217 1295,227 1288,219
        1240,229 1232,221 1185,231 1178,223 1130,233 1122,225 1075,235 1068,227
        1020,237 1012,229 965,239 958,231 910,241 902,233 855,243 848,235
        800,245 792,237 745,247 738,239 690,249 682,241 635,251 628,243
        580,253 572,245 525,255 518,247 470,257 462,249 415,259 408,251
        360,261 352,253 305,263 298,255 250,265 242,257 195,267 188,259
        140,269 132,261 85,271 78,263 0,272
      " />
    </clipPath>

    <clipPath id="sawLowerClip">
      <polygon points="
        0,486 1960,486 1960,210
        1890,216 1882,208 1840,218 1832,211 1790,221 1782,213 1735,223 1728,215
        1680,225 1672,217 1625,227 1618,219 1570,229 1562,221 1515,231 1508,223
        1460,233 1452,225 1405,235 1398,227 1350,237 1342,229 1295,239 1288,231
        1240,241 1232,233 1185,243 1178,235 1130,245 1122,237 1075,247 1068,239
        1020,249 1012,241 965,251 958,243 910,253 902,245 855,255 848,247
        800,257 792,249 745,259 738,251 690,261 682,253 635,263 628,255
        580,265 572,257 525,267 518,259 470,269 462,261 415,271 408,263
        360,273 352,265 305,275 298,267 250,277 242,269 195,279 188,271
        140,281 132,273 85,283 78,275 0,284
      " />
    </clipPath>

    <!-- Reusable Group for the Full "NOBLE FERMI" Heavy Letterforms -->
    <g id="wordmarkLetters" filter="url(#roughMetal)">
      <!-- "NOBLE" in Brushed Titanium Steel -->
      <text
        x="72"
        y="345"
        fill="url(#steelGrad)"
        stroke="#E2E8F0"
        stroke-width="2"
        font-family="Impact, 'Arial Black', 'Space Grotesk', sans-serif"
        font-size="278"
        font-weight="900"
        font-style="italic"
        letter-spacing="10"
      >NOBLE</text>

      <!-- "FERMI" in Anodized Afterburner Amber -->
      <text
        x="982"
        y="345"
        fill="url(#amberGrad)"
        stroke="#FDE68A"
        stroke-width="2"
        font-family="Impact, 'Arial Black', 'Space Grotesk', sans-serif"
        font-size="278"
        font-weight="900"
        font-style="italic"
        letter-spacing="10"
      >FERMI</text>
    </g>
  </defs>

  <!-- =====================================================================
       1. CORNER HUD FRAMING BRACKETS & LOWER TACTICAL TELEMETRY BAR
       ===================================================================== -->
  <g stroke="#00E5FF" stroke-width="4.5" stroke-linecap="square" opacity="0.9">
    <path d="M 28 84 L 28 34 L 78 34" />
    <path d="M 1932 84 L 1932 34 L 1882 34" />
    <path d="M 28 386 L 28 436 L 78 436" />
    <path d="M 1932 386 L 1932 436 L 1882 436" />
  </g>

  <!-- =====================================================================
       2. SPLIT HACKSAW-SHEARED WORDMARK ("NOBLE FERMI")
          Upper half is displaced (+11px X, -4px Y) along the serrated kerf!
       ===================================================================== -->
  <!-- Lower Half of Letters (Below Hacksaw Cut) -->
  <g clip-path="url(#sawLowerClip)">
    <use href="#wordmarkLetters" />
  </g>

  <!-- Upper Half of Letters (Sheared Right & Up by the Hacksaw Blade!) -->
  <g clip-path="url(#sawUpperClip)">
    <g transform="translate(11, -4)">
      <use href="#wordmarkLetters" />
    </g>
  </g>

  <!-- =====================================================================
       3. SERRATED HACKSAW INCISION KERF, SPARKS & SECONDARY BLADE GASHES
       ===================================================================== -->
  <!-- Hot Friction-Cut Kerf Line & Saw-Teeth Gouges -->
  <polyline
    points="
      42,278 78,269 85,277 132,267 140,275 188,265 195,273 242,263 250,271 298,261 305,269
      352,259 360,267 408,257 415,265 462,255 470,263 518,253 525,261 572,251 580,259
      628,249 635,257 682,247 690,255 738,245 745,253 792,243 800,251 848,241 855,249
      902,239 910,247 958,237 965,245 1012,235 1020,243 1068,233 1075,241 1122,231 1130,239
      1178,229 1185,237 1232,227 1240,235 1288,225 1295,233 1342,223 1350,231 1398,221 1405,229
      1452,219 1460,227 1508,217 1515,225 1562,215 1570,223 1618,213 1625,221 1672,211 1680,219
      1728,209 1735,217 1782,207 1790,215 1832,205 1840,212 1882,202 1924,204
    "
    fill="none"
    stroke="#00E5FF"
    stroke-width="2.5"
    stroke-opacity="0.85"
  />

  <!-- Deep Diagonal Hacksaw Gashes into Upper Edges of "L/E" and "R/M" -->
  <polygon points="622,92 634,88 738,216 724,222" fill="#030712" stroke="#FFB300" stroke-width="1.5" />
  <polygon points="1340,94 1354,90 1462,218 1446,224" fill="#030712" stroke="#00E5FF" stroke-width="1.5" />

  <!-- =====================================================================
       4. HIGH-CALIBER BULLET HOLE IN "B" (AND RICOCHET CRATER IN "R")
       ===================================================================== -->
  <!-- Primary 7.62mm Bullet Hole Punched Through the "B" in NOBLE (x=476, y=198) -->
  <g transform="translate(476, 198)">
    <!-- Outer Carbon Powder-Burn Scorch Halo -->
    <circle cx="0" cy="0" r="56" fill="url(#bulletScorch)" />

    <!-- Radial Stress Fracture Cracks in the Heavy Metal -->
    <g stroke="#050811" stroke-width="3.5" stroke-linecap="round">
      <polyline points="0,0 -34,-42 -52,-56" />
      <polyline points="0,0 38,-36 62,-44" />
      <polyline points="0,0 48,14 74,26" />
      <polyline points="0,0 24,44 36,68" />
      <polyline points="0,0 -32,38 -56,52" />
      <polyline points="0,0 -48,-6 -72,-12" />
    </g>
    <!-- Glowing Molten Fracture Highlights -->
    <g stroke="#FFB300" stroke-width="1.2" opacity="0.8">
      <line x1="-18" y1="-22" x2="-46" y2="-50" />
      <line x1="20" y1="-18" x2="54" y2="-38" />
      <line x1="24" y1="8" x2="64" y2="22" />
      <line x1="-18" y1="20" x2="-48" y2="46" />
    </g>

    <!-- Peeled-Back Jagged Metal Exit Petals -->
    <polygon
      points="
        0,-34 10,-24 24,-30 22,-14 36,-10 26,4 34,18 18,20 14,34 0,24
        -12,36 -18,20 -34,18 -24,4 -36,-12 -20,-16 -22,-32 -8,-22
      "
      fill="#94A3B8"
      stroke="#1E293B"
      stroke-width="2"
    />

    <!-- Punched-Through Pitch-Black Bullet Cavity with Molten Ember Rim -->
    <polygon
      points="
        0,-23 8,-17 17,-20 15,-9 24,-5 17,4 22,13 11,14 8,23 0,16
        -9,24 -12,13 -23,11 -16,2 -24,-8 -13,-11 -14,-21 -5,-15
      "
      fill="#020409"
      stroke="#FF6D00"
      stroke-width="2.5"
    />
  </g>

  <!-- Secondary Cyan-Plasma Bullet Ricochet Crater on "R" in FERMI (x=1336, y=268) -->
  <g transform="translate(1336, 268)">
    <circle cx="0" cy="0" r="38" fill="url(#cyanScorch)" />
    <g stroke="#040812" stroke-width="3">
      <line x1="0" y1="0" x2="-32" y2="-28" />
      <line x1="0" y1="0" x2="36" y2="-22" />
      <line x1="0" y1="0" x2="28" y2="34" />
      <line x1="0" y1="0" x2="-34" y2="24" />
    </g>
    <polygon
      points="0,-16 11,-12 17,0 12,13 0,17 -13,11 -17,-2 -10,-13"
      fill="#02050B"
      stroke="#00E5FF"
      stroke-width="2.2"
    />
  </g>

  <!-- =====================================================================
       5. LOWER TACTICAL DIVIDER & CALIBER STAMP
       ===================================================================== -->
  <line x1="82" y1="416" x2="720" y2="416" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.85" />
  <polygon points="748,400 1212,400 1198,432 734,432" fill="#050C18" stroke="#FFB300" stroke-width="2.5" />
  <text
    x="974"
    y="422"
    text-anchor="middle"
    fill="#00E5FF"
    font-family="'JetBrains Mono', monospace"
    font-size="17"
    font-weight="700"
    letter-spacing="6"
  >128-HZ // CHRONO-BALLISTIC WARFARE</text>
  <line x1="1240" y1="416" x2="1878" y2="416" stroke="#FFB300" stroke-width="3" stroke-opacity="0.85" />
</svg>
